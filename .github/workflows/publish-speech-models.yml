name: Publish immutable speech model release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag in the offline-signed speech model catalog
        required: true
        default: speech-models-v3
      key_id:
        description: Expected offline speech model signing key ID
        required: true

permissions:
  contents: write

concurrency:
  group: publish-speech-models-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: speech-models-release
    env:
      GH_HOST: github.com
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_KEY_ID: ${{ inputs.key_id }}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Dispatch from the repository's default branch." >&2
            exit 1
          fi

      - name: Checkout shared-assets repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run speech model distribution tests
        run: python -m unittest discover -s tools/speech-model-distribution/tests -v

      - name: Require and validate the offline-signed release inputs
        id: catalog
        # The current catalog uses the newest schema's file name (catalog-v3.json for schema 3). From release 3 on the same
        # release may also publish a companion: a catalog of an older schema with the same catalogVersion, re-signed for
        # older plugins (decision D127, catalog-v2.json). Every other older file stays frozen in speech-models/catalogs and
        # must equal a signed copy under catalogs/history.
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, "tools/speech-model-distribution")
          from verify_release import distribution
          root = pathlib.Path("speech-models")
          name, signature = distribution.CATALOG_FILE, distribution.SIGNATURE_FILE
          for relative in ("catalogs/" + name, "catalogs/" + signature, "keys/catalog-signing-public.pem"):
              if not (root / relative).is_file():
                  raise SystemExit("Missing offline-reviewed signing input: " + relative + "; nothing will be published")
          catalog = distribution.read_json(root / "catalogs" / name)
          distribution.validate_catalog(catalog, expected_repository=os.environ["GITHUB_REPOSITORY"])
          if distribution.catalog_file(catalog["schemaVersion"]) != name:
              raise SystemExit("The current catalog must use the newest catalog schema")
          if catalog["releaseTag"] != os.environ["RELEASE_TAG"]:
              raise SystemExit("Dispatch release_tag differs from the signed catalog")
          companions, exempt = [], {name, signature}
          for schema in distribution.CATALOG_SCHEMAS[:-1]:
              path = root / "catalogs" / distribution.catalog_file(schema)
              if path.is_file() and distribution.read_json(path).get("catalogVersion") == catalog["catalogVersion"]:
                  if not (root / "catalogs" / distribution.signature_file(schema)).is_file():
                      raise SystemExit("Missing offline-reviewed signing input: catalogs/" + distribution.signature_file(schema))
                  companions.append(str(schema))
                  exempt.update((distribution.catalog_file(schema), distribution.signature_file(schema)))
          for frozen in sorted((root / "catalogs").glob("catalog-v*.json")):
              if frozen.name not in exempt and not any(
                      copy.read_bytes() == frozen.read_bytes() for copy in (root / "catalogs/history").glob("v*/" + frozen.name)):
                  raise SystemExit("Frozen catalog file has no identical signed history copy: " + frozen.name)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("version=" + str(catalog["catalogVersion"]) + "\n")
              output.write("schema=" + str(catalog["schemaVersion"]) + "\n")
              output.write("generated_at=" + catalog["generatedAt"] + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("CATALOG_NAME=" + name + "\nSIGNATURE_NAME=" + signature + "\n")
              environment.write("CURRENT_CATALOG=speech-models/catalogs/" + name + "\n")
              environment.write("CURRENT_SIGNATURE=speech-models/catalogs/" + signature + "\n")
              environment.write("COMPANION_SCHEMAS=" + " ".join(companions) + "\n")
          PY

      - name: Verify current and historical catalog signatures
        env:
          CATALOG_VERSION: ${{ steps.catalog.outputs.version }}
          CATALOG_SCHEMA: ${{ steps.catalog.outputs.schema }}
        run: |
          set -euo pipefail
          # history/vN holds the signed catalogs of release N under their schemas' file names (catalog-v1.json, catalog-v2.json,
          # ...). A catalog of schema S builds on the previous release's catalog of the newest schema not above S.
          history_catalog() {
            local schema
            for (( schema=$2; schema>=1; schema-- )); do
              if [[ -f "speech-models/catalogs/history/v$1/catalog-v$schema.json" ]]; then
                printf '%s\n' "speech-models/catalogs/history/v$1/catalog-v$schema.json"
                return 0
              fi
            done
            echo "speech-models/catalogs/history/v$1 holds no catalog of schema $2 or older" >&2
            return 1
          }
          previous_args=()
          if (( CATALOG_VERSION > 1 )); then
            previous=$(history_catalog $((CATALOG_VERSION - 1)) "$CATALOG_SCHEMA")
            echo "PREVIOUS_CATALOG=$previous" >> "$GITHUB_ENV"
            previous_args=(--previous-catalog "$previous")
          fi
          python tools/speech-model-distribution/verify_catalog.py \
            "$CURRENT_CATALOG" \
            --signature "$CURRENT_SIGNATURE" \
            --public-key speech-models/keys/catalog-signing-public.pem \
            --expected-key-id "$EXPECTED_KEY_ID" --expected-repository "$GITHUB_REPOSITORY" \
            --minimum-catalog-version "$CATALOG_VERSION" "${previous_args[@]}"
          for schema in $COMPANION_SCHEMAS; do
            previous=$(history_catalog $((CATALOG_VERSION - 1)) "$schema")
            echo "PREVIOUS_CATALOG_V$schema=$previous" >> "$GITHUB_ENV"
            python tools/speech-model-distribution/verify_catalog.py \
              "speech-models/catalogs/catalog-v$schema.json" \
              --signature "speech-models/catalogs/catalog-v$schema.sig.json" \
              --public-key speech-models/keys/catalog-signing-public.pem \
              --expected-key-id "$EXPECTED_KEY_ID" --expected-repository "$GITHUB_REPOSITORY" \
              --minimum-catalog-version "$CATALOG_VERSION" --previous-catalog "$previous"
          done
          for (( version=1; version<CATALOG_VERSION; version++ )); do
            found=0
            for history in "speech-models/catalogs/history/v$version"/catalog-v*.json; do
              if [[ ! -f "$history" || "$history" == *.sig.json ]]; then
                continue
              fi
              found=1
              schema=${history##*/catalog-v}
              schema=${schema%.json}
              previous_history_args=()
              if (( version > 1 )); then
                previous=$(history_catalog $((version - 1)) "$schema")
                previous_history_args=(--previous-catalog "$previous")
              fi
              python tools/speech-model-distribution/verify_catalog.py \
                "$history" --signature "${history%.json}.sig.json" \
                --public-key speech-models/keys/catalog-signing-public.pem \
                --expected-key-id "$EXPECTED_KEY_ID" --expected-repository "$GITHUB_REPOSITORY" \
                --minimum-catalog-version "$version" "${previous_history_args[@]}"
              python - "$history" "$version" "$schema" <<'PY'
          import json, pathlib, sys
          catalog = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (catalog["catalogVersion"], catalog["schemaVersion"]) != (int(sys.argv[2]), int(sys.argv[3])):
              raise SystemExit("History path and signed catalog version or schema differ")
          PY
            done
            if (( found == 0 )); then
              echo "speech-models/catalogs/history/v$version holds no catalog" >&2
              exit 1
            fi
          done

      - name: Reproduce the reviewed catalog from its sources
        env:
          CATALOG_VERSION: ${{ steps.catalog.outputs.version }}
          CATALOG_GENERATED_AT: ${{ steps.catalog.outputs.generated_at }}
        run: |
          set -euo pipefail
          previous_args=()
          if (( CATALOG_VERSION > 1 )); then
            previous_args=(--previous-catalog "$PREVIOUS_CATALOG")
          fi
          python tools/speech-model-distribution/build_catalog.py \
            --source-root speech-models/sources --output build/speech-models-current \
            --repository "$GITHUB_REPOSITORY" --catalog-version "$CATALOG_VERSION" \
            --generated-at "$CATALOG_GENERATED_AT" "${previous_args[@]}"
          cmp "$CURRENT_CATALOG" "build/speech-models-current/$CATALOG_NAME"
          pending="speech-models/catalogs/pending/v${CATALOG_VERSION}"
          if [[ -f "$pending/$CATALOG_NAME" ]]; then
            cmp "$pending/$CATALOG_NAME" "$CURRENT_CATALOG"
          fi
          if [[ -f "$pending/$SIGNATURE_NAME" ]]; then
            cmp "$pending/$SIGNATURE_NAME" "$CURRENT_SIGNATURE"
          fi
          # A companion is the same release built for an older schema. It leaves out the versions that need the newer
          # schema, so its archives must be a subset of the current catalog's.
          for schema in $COMPANION_SCHEMAS; do
            previous_variable="PREVIOUS_CATALOG_V$schema"
            python tools/speech-model-distribution/build_catalog.py \
              --source-root speech-models/sources --output "build/speech-models-schema-$schema" \
              --repository "$GITHUB_REPOSITORY" --catalog-version "$CATALOG_VERSION" \
              --generated-at "$CATALOG_GENERATED_AT" --previous-catalog "${!previous_variable}" --schema "$schema"
            cmp "speech-models/catalogs/catalog-v$schema.json" "build/speech-models-schema-$schema/catalog-v$schema.json"
            for name in "catalog-v$schema.json" "catalog-v$schema.sig.json"; do
              if [[ -f "$pending/$name" ]]; then
                cmp "$pending/$name" "speech-models/catalogs/$name"
              fi
            done
            extra=$(comm -23 <(sort "build/speech-models-schema-$schema/release-assets.txt") <(sort build/speech-models-current/release-assets.txt))
            if [[ -n "$extra" ]]; then
              echo "catalog-v$schema.json introduces archives that $CATALOG_NAME does not: $extra" >&2
              exit 1
            fi
          done

      - name: Rebuild the new mirror archives from pinned upstream assets
        # Upstream-only versions (mirror null in the catalog) have no archive: they are neither rebuilt
        # here nor uploaded below, because release-assets.txt lists only versions with a mirror record.
        run: |
          set -euo pipefail
          python tools/speech-model-distribution/prepare_sources.py \
            --catalog "$CURRENT_CATALOG" --source-root speech-models/sources \
            --cache-dir build/speech-models-upstream --output-dir build/speech-models-assets
          python tools/speech-model-distribution/verify_release.py \
            "$CURRENT_CATALOG" --assets-dir build/speech-models-assets \
            --asset-list build/speech-models-current/release-assets.txt \
            --expected-repository "$GITHUB_REPOSITORY"
          rm -rf build/speech-models-upstream

      - name: Confirm authenticated absence of both the release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/speech-model-distribution/verify_release.py --check-absent \
            --repository "$GITHUB_REPOSITORY" --release-tag "$RELEASE_TAG"

      - name: Create a new tag, upload to a draft release, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_paths=()
          while IFS= read -r name; do
            if [[ -n "$name" ]]; then asset_paths+=("build/speech-models-assets/$name"); fi
          done < build/speech-models-current/release-assets.txt
          for schema in $COMPANION_SCHEMAS; do
            asset_paths+=("speech-models/catalogs/catalog-v$schema.json" "speech-models/catalogs/catalog-v$schema.sig.json")
          done
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field ref="refs/tags/$RELEASE_TAG" --raw-field sha="$GITHUB_SHA" >/dev/null
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --latest=false \
            --title "AutoJs6 speech models $RELEASE_TAG" \
            --notes "Offline-signed, content-addressed sherpa-onnx speech models for 3-Macaw Speech. Licenses: speech-models/sources and speech-models/audits." \
            "${asset_paths[@]}" "$CURRENT_CATALOG" "$CURRENT_SIGNATURE"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Download every published asset and verify exact reviewed bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          downloaded=$(mktemp -d)
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$downloaded"
          companion_args=()
          names=("$CATALOG_NAME")
          for schema in $COMPANION_SCHEMAS; do
            companion_args+=(--companion "speech-models/catalogs/catalog-v$schema.json" "speech-models/catalogs/catalog-v$schema.sig.json")
            names+=("catalog-v$schema.json")
          done
          python tools/speech-model-distribution/verify_release.py \
            "$CURRENT_CATALOG" --assets-dir "$downloaded" \
            --downloaded-release --signature "$CURRENT_SIGNATURE" "${companion_args[@]}" \
            --expected-repository "$GITHUB_REPOSITORY"
          for name in "${names[@]}"; do
            python tools/speech-model-distribution/verify_catalog.py "$downloaded/$name" \
              --signature "$downloaded/${name%.json}.sig.json" --public-key speech-models/keys/catalog-signing-public.pem \
              --expected-key-id "$EXPECTED_KEY_ID" --expected-repository "$GITHUB_REPOSITORY"
          done
