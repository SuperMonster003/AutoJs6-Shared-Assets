name: Publish immutable holiday calendar release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag in the offline-signed holiday calendar catalog
        required: true
        default: holiday-calendars-v1
      key_id:
        description: Expected offline holiday calendar signing key ID
        required: true

permissions:
  contents: write

concurrency:
  group: publish-holiday-calendars-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: holiday-calendars-release
    env:
      GH_HOST: github.com
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_KEY_ID: ${{ inputs.key_id }}
      TOOLS: tools/holiday-calendar-distribution
      FAMILY_DIR: holiday-calendars
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Dispatch from the repository's default branch." >&2
            exit 1
          fi

      - name: Checkout shared-assets repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the pinned generator
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$TOOLS/requirements.txt"

      - name: Run holiday calendar distribution tests
        run: python -m unittest discover -s "$TOOLS/tests" -t "$TOOLS" -v

      - name: Regenerate the data from the pinned python-holidays release
        run: python "$TOOLS/generate_calendars.py" --config "$FAMILY_DIR/sources/generator.json" --check-dir "$FAMILY_DIR/data"

      - name: Require and validate the offline-signed release inputs
        id: catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, os.environ["TOOLS"])
          import calendar_format as fmt
          root = pathlib.Path(os.environ["FAMILY_DIR"])
          for relative in ("catalogs/" + fmt.CATALOG_NAME, "catalogs/" + fmt.SIGNATURE_NAME, "keys/catalog-signing-public.pem"):
              if not (root / relative).is_file():
                  raise SystemExit("Missing offline-reviewed signing input: " + relative + "; nothing will be published")
          catalog, _ = fmt.read_json(root / "catalogs" / fmt.CATALOG_NAME, fmt.MAX_CATALOG_BYTES)
          fmt.validate_catalog(catalog, expected_repository=os.environ["GITHUB_REPOSITORY"])
          if catalog["releaseTag"] != os.environ["RELEASE_TAG"]:
              raise SystemExit("Dispatch release_tag differs from the signed catalog")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("version=" + str(catalog["catalogVersion"]) + "\n")
              output.write("generated_at=" + catalog["generatedAt"] + "\n")
          PY
          echo "CURRENT_CATALOG=$FAMILY_DIR/catalogs/catalog-v1.json" >> "$GITHUB_ENV"
          echo "CURRENT_SIGNATURE=$FAMILY_DIR/catalogs/catalog-v1.sig.json" >> "$GITHUB_ENV"

      - name: Verify current and historical catalog signatures
        env:
          CATALOG_VERSION: ${{ steps.catalog.outputs.version }}
        run: |
          set -euo pipefail
          key=(--public-key "$FAMILY_DIR/keys/catalog-signing-public.pem" --expected-key-id "$EXPECTED_KEY_ID"
               --expected-repository "$GITHUB_REPOSITORY")
          previous_args=(--first-release)
          if (( CATALOG_VERSION > 1 )); then
            previous="$FAMILY_DIR/catalogs/history/v$((CATALOG_VERSION - 1))/catalog-v1.json"
            echo "PREVIOUS_CATALOG=$previous" >> "$GITHUB_ENV"
            previous_args=(--previous-catalog "$previous")
          fi
          python "$TOOLS/verify_calendars.py" "$CURRENT_CATALOG" --data-dir "$FAMILY_DIR/data" \
            --signature "$CURRENT_SIGNATURE" "${key[@]}" "${previous_args[@]}" \
            --known-dates "$FAMILY_DIR/sources/known-dates.json" --sizes
          for (( version=1; version<CATALOG_VERSION; version++ )); do
            history="$FAMILY_DIR/catalogs/history/v$version/catalog-v1.json"
            python "$TOOLS/verify_release.py" --verify-signature "$history" \
              --signature "${history%.json}.sig.json" "${key[@]}"
          done

      - name: Reproduce the reviewed catalog and stage the new assets
        env:
          CATALOG_VERSION: ${{ steps.catalog.outputs.version }}
          CATALOG_GENERATED_AT: ${{ steps.catalog.outputs.generated_at }}
        run: |
          set -euo pipefail
          previous_args=()
          if (( CATALOG_VERSION > 1 )); then
            previous_args=(--previous-catalog "$PREVIOUS_CATALOG")
          fi
          python "$TOOLS/build_catalog.py" --data-dir "$FAMILY_DIR/data" --output-dir build/holiday-calendars-current \
            --repository "$GITHUB_REPOSITORY" --catalog-version "$CATALOG_VERSION" \
            --generated-at "$CATALOG_GENERATED_AT" --stage-assets build/holiday-calendars-assets "${previous_args[@]}"
          cmp "$CURRENT_CATALOG" build/holiday-calendars-current/catalog-v1.json
          pending="$FAMILY_DIR/catalogs/pending/v${CATALOG_VERSION}"
          for name in catalog-v1.json release-assets.txt preparation.json; do
            if [[ -f "$pending/$name" ]]; then
              cmp "$pending/$name" "build/holiday-calendars-current/$name"
            fi
          done
          if [[ -f "$pending/catalog-v1.sig.json" ]]; then
            cmp "$pending/catalog-v1.sig.json" "$CURRENT_SIGNATURE"
          fi
          python "$TOOLS/verify_release.py" "$CURRENT_CATALOG" --assets-dir build/holiday-calendars-assets \
            --asset-list build/holiday-calendars-current/release-assets.txt

      - name: Confirm authenticated absence of both the release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "$TOOLS/verify_release.py" --check-absent --repository "$GITHUB_REPOSITORY" --release-tag "$RELEASE_TAG"

      - name: Create a new tag, upload to a draft release, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_paths=()
          while IFS= read -r name; do
            if [[ -n "$name" ]]; then asset_paths+=("build/holiday-calendars-assets/$name"); fi
          done < build/holiday-calendars-current/release-assets.txt
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field ref="refs/tags/$RELEASE_TAG" --raw-field sha="$GITHUB_SHA" >/dev/null
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --latest=false \
            --title "AutoJs6 holiday calendars $RELEASE_TAG" \
            --notes "Offline-signed, content-addressed public holiday calendars generated from python-holidays (MIT) for 3-Chime Alarm. Format and license: holiday-calendars/README.md." \
            "${asset_paths[@]}" "$CURRENT_CATALOG" "$CURRENT_SIGNATURE"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Download every published asset and verify exact reviewed bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          downloaded=$(mktemp -d)
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$downloaded"
          python "$TOOLS/verify_release.py" "$CURRENT_CATALOG" --assets-dir "$downloaded" \
            --asset-list build/holiday-calendars-current/release-assets.txt \
            --downloaded-release --signature "$CURRENT_SIGNATURE"
          python "$TOOLS/verify_release.py" --verify-signature "$downloaded/catalog-v1.json" \
            --signature "$downloaded/catalog-v1.sig.json" \
            --public-key "$FAMILY_DIR/keys/catalog-signing-public.pem" --expected-key-id "$EXPECTED_KEY_ID" \
            --expected-repository "$GITHUB_REPOSITORY"
